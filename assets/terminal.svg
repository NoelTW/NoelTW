<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="430">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.9); }
    }
    .term-window { fill: url(#bg-grad); stroke: #1e293b; stroke-width: 1.5; rx: 12; }
    .term-header { fill: #0f172a; stroke: #1e293b; stroke-width: 1; }
    .term-title { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; fill: #64748b; font-weight: 500; }
    .code-text { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13.5px; }
    .cmd-prompt { fill: #38bdf8; font-weight: 700; }
    .cmd-dir { fill: #818cf8; font-weight: 600; }
    .cmd-branch { fill: #c084fc; font-weight: 500; }
    .cmd-text { fill: #f1f5f9; font-weight: 600; }
    .cmd-flag { fill: #2dd4bf; }
    .out-label { fill: #60a5fa; font-weight: 600; }
    .out-highlight { fill: #ffffff; font-weight: 700; }
    .out-text { fill: #94a3b8; }
    .out-accent { fill: #34d399; font-weight: 600; }
    .cursor { fill: #38bdf8; animation: blink 1s infinite; }
    .pulse-dot { fill: #10b981; filter: url(#glow-green); }
    .header-badge { fill: #1e293b; rx: 4; }
    .header-badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #10b981; font-weight: 600; }
  </style>

  <!-- Terminal Container Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="15" width="800" height="395" class="term-window"/>
    <path d="M 20 27 Q 20 15 32 15 L 808 15 Q 820 15 820 27 L 820 50 L 20 50 Z" class="term-header"/>
  </g>

  <!-- Window Controls -->
  <circle cx="44" cy="32" r="6" fill="#ef4444"/>
  <circle cx="64" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="32" r="6" fill="#10b981"/>
  
  <!-- Terminal Title & Starship Context -->
  <text x="420" y="36" text-anchor="middle" class="term-title">noel@micron ~ agentic-workspace ‹zsh›</text>

  <!-- Live Status Badge in Header -->
  <rect x="700" y="24" width="95" height="18" class="header-badge"/>
  <circle cx="712" cy="33" r="3.5" class="pulse-dot"/>
  <text x="722" y="36" class="header-badge-text">PRODUCTION</text>

  <!-- Terminal Content Lines -->
  <g class="code-text" transform="translate(46, 82)">
    
    <!-- Command 1: Identity & Primary Role -->
    <g transform="translate(0, 0)">
      <text y="0">
        <tspan class="cmd-prompt">❯ </tspan>
        <tspan class="cmd-dir">~/micron/agentic </tspan>
        <tspan class="cmd-branch">git:(main) </tspan>
        <tspan class="cmd-text">noel profile </tspan>
        <tspan class="cmd-flag">--role</tspan>
      </text>
      <text y="24">
        <tspan class="out-label">Primary Role : </tspan>
        <tspan class="out-highlight">Senior Data Scientist @ Micron Technology</tspan>
      </text>
      <text y="48">
        <tspan class="out-label">Focus Area   : </tspan>
        <tspan class="out-text">Agentic AI Architectures • Multi-Agent LLMs • Industrial AI</tspan>
      </text>
    </g>

    <!-- Command 2: Quantitative Trading Side Project -->
    <g transform="translate(0, 96)">
      <text y="0">
        <tspan class="cmd-prompt">❯ </tspan>
        <tspan class="cmd-dir">~/side/quant </tspan>
        <tspan class="cmd-branch">git:(alpha) </tspan>
        <tspan class="cmd-text">engine status </tspan>
        <tspan class="cmd-flag">--profile=live</tspan>
      </text>
      <text y="24">
        <tspan class="out-label">Side Project : </tspan>
        <tspan class="out-highlight">Autonomous Quantitative Trading Engine</tspan>
        <tspan class="out-text"> (Taiwan &amp; US)</tspan>
      </text>
      <text y="48">
        <tspan class="out-label">Core Models  : </tspan>
        <tspan class="out-text">GA-047 (Adaptive-ML) • PRAD-007 (Regime-Drift) • Macro Gates</tspan>
      </text>
    </g>

    <!-- Command 3: System Health & Execution Summary -->
    <g transform="translate(0, 192)">
      <text y="0">
        <tspan class="cmd-prompt">❯ </tspan>
        <tspan class="cmd-text">cluster-health </tspan>
        <tspan class="cmd-flag">--summary</tspan>
      </text>
      <text y="25">
        <tspan fill="#10b981">● </tspan>
        <tspan class="out-highlight">Enterprise Agentic Systems  : </tspan>
        <tspan class="out-accent">[ACTIVE] </tspan>
        <tspan class="out-text">Multi-agent orchestration in production</tspan>
      </text>
      <text y="49">
        <tspan fill="#10b981">● </tspan>
        <tspan class="out-highlight">Quantitative Live Pipeline  : </tspan>
        <tspan class="out-accent">[ACTIVE] </tspan>
        <tspan class="out-text">Daily automated risk &amp; execution (Sharpe 3.80)</tspan>
      </text>
    </g>

    <!-- Active Blinking Prompt -->
    <g transform="translate(0, 280)">
      <text y="0">
        <tspan class="cmd-prompt">❯ </tspan>
        <tspan class="cmd-dir">~/micron </tspan>
        <tspan class="cmd-branch">git:(main) </tspan>
      </text>
      <rect x="180" y="-12" width="8" height="15" class="cursor"/>
    </g>
    
  </g>
</svg>
